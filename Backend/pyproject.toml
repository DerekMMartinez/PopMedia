[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.59",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.122.0",
    "firebase-admin>=7.1.0",
    "flask>=3.1.2",
    "markdown>=3.10.2",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pinecone>=8.0.0",
    "pydantic>=2.12.4",
    "pytest-cov",
    "pytest-mock",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "sentence-transformers>=5.1.2",
    "torch>=2.9.1",
    "transformers>=4.57.1",
    "uvicorn>=0.38.0",
    "supabase>=2.3.0",
    "firebase-admin>=7.1.0",
    "pinecone>=8.0.0",
    "boto3>=1.42.56",
    "cohere>=5.21.1",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.14.5",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "pytest-mock",
]

[tool.black]
line-length = 88
exclude = '''
/(
    \.venv
  | \.pytest_cache
  | \.env
  | uv\.lock
)/
'''

[tool.ruff]
line-length = 88
exclude = [".venv", ".pytest_cache", ".env", "uv.lock"]

[tool.ruff.lint]
ignore = ["F841", "F811", "E402", "E712", "E722", "F601"]

[tool.pytest.ini_options]
pythonpath = ["."]